name: Diem
options:
  bundleIdPrefix: com.injoon5
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

# Model, design and intents are shared with the widget extension; views are not.
fileGroups:
  - ../README.md

targets:
  Diem:
    type: application
    platform: watchOS
    sources:
      - path: Diem
    dependencies:
      - target: DiemWidget
        embed: true
    entitlements:
      path: Diem/Diem.entitlements
      properties:
        # Time Sensitive notifications are deliberately absent: the team
        # provisioning profile does not carry that capability, so requesting it
        # fails to sign. The completion alert uses the ordinary .active level.
        com.apple.security.application-groups:
          - group.com.injoon5.diem
    info:
      path: Diem/Info.plist
      properties:
        CFBundleDisplayName: Diem
        WKApplication: true
        # `WKWatchOnly` alone. Declaring `WKRunsIndependentlyOfCompanionApp`
        # alongside it is what installation refuses — the two answer the same
        # question and the pair is ambiguous. `WKRunsIndependentlyOfCompanionApp`
        # is the answer for a watch app embedded in an iOS app that can run
        # without it; there is no iOS target here, so `WKWatchOnly` is the true
        # one. The spec is the source of truth and the generated plist is not
        # committed, so this is the only place the key is stated.
        WKWatchOnly: true
        WKSupportsLiveActivityLaunchAttributes: true
        # What lets the app claim an extended runtime session, and so hold the
        # foreground for as long as a session is live. Only one extended-runtime
        # mode may be declared, and `mindfulness` is the only one that runs
        # frontmost for longer than ten minutes. `workout-processing` was here
        # and is gone with it: nothing ever started an `HKWorkoutSession`, and
        # it is the iOS spelling of the key on a watch-only target besides.
        WKBackgroundModes:
          - mindfulness
        DiemAPIBaseURL: https://diem.ij5.dev
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injoon5.diem.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Diem

  DiemWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: DiemWidget
      - path: Diem/Model
      - path: Diem/Design
      - path: Diem/Intents
      - path: Diem/Sync/DTO.swift
    entitlements:
      path: DiemWidget/DiemWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.injoon5.diem
    info:
      path: DiemWidget/Info.plist
      properties:
        CFBundleDisplayName: Diem
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injoon5.diem.watchkitapp.widget

  DiemTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: DiemTests
    dependencies:
      - target: Diem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injoon5.diem.watchkitapp.tests

schemes:
  Diem:
    build:
      targets:
        Diem: all
        DiemWidget: all
    test:
      targets:
        - DiemTests
    run:
      config: Debug
