name: Diem
options:
  bundleIdPrefix: app.diem
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

# Model, design and intents are shared with the widget extension; views are not.
fileGroups:
  - ../README.md

targets:
  Diem:
    type: application
    platform: watchOS
    sources:
      - path: Diem
    dependencies:
      - target: DiemWidget
        embed: true
    entitlements:
      path: Diem/Diem.entitlements
      properties:
        # Time Sensitive is what lets the deadline alert through a Focus, which
        # is the situation a study timer's alert exists for. The level was set
        # in code without it, so the system quietly delivered an ordinary one.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.app.diem
    info:
      path: Diem/Info.plist
      properties:
        CFBundleDisplayName: Diem
        WKApplication: true
        # Both keys, in one place. The tracked `Info.plist` had `WKWatchOnly`
        # and not this one; the spec had this one and not that — so the first
        # `xcodegen generate` after a checkout rewrote a tracked file and
        # silently dropped a key. The spec is the source of truth, and the
        # generated plist is no longer committed.
        WKRunsIndependentlyOfCompanionApp: true
        WKWatchOnly: true
        WKSupportsLiveActivityLaunchAttributes: true
        # What lets the app claim an extended runtime session, and so hold the
        # foreground for as long as a session is live. Only one extended-runtime
        # mode may be declared, and `mindfulness` is the only one that runs
        # frontmost for longer than ten minutes. `workout-processing` was here
        # and is gone with it: nothing ever started an `HKWorkoutSession`, and
        # it is the iOS spelling of the key on a watch-only target besides.
        WKBackgroundModes:
          - mindfulness
        DiemAPIBaseURL: https://diem.app
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diem.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Diem

  DiemWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: DiemWidget
      - path: Diem/Model
      - path: Diem/Design
      - path: Diem/Intents
      - path: Diem/Sync/DTO.swift
    entitlements:
      path: DiemWidget/DiemWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.diem
    info:
      path: DiemWidget/Info.plist
      properties:
        CFBundleDisplayName: Diem
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diem.watchkitapp.widget

  DiemTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: DiemTests
    dependencies:
      - target: Diem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diem.watchkitapp.tests

schemes:
  Diem:
    build:
      targets:
        Diem: all
        DiemWidget: all
    test:
      targets:
        - DiemTests
    run:
      config: Debug
